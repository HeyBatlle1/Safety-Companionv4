services:
  scd:
    build: .
    env_file: .env
    restart: unless-stopped
    expose: ["8787"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - SC_DOMAIN=${SC_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [scd]

volumes:
  caddy_data:
  caddy_config:
