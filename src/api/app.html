<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safety Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101317; --panel:#1a1e24; --panel2:#222831; --line:#3a414d; --line2:#4a5260;
  --amber:#e0b94f; --amber-deep:#c9a84c;
  --text:#f2f5f9; --muted:#aab4c2;
  --danger:#ff5d57; --warning:#ff9d3d; --caution:#f2d04e; --safe:#4fc06a; --notice:#6aa9e8;
  --mono:'JetBrains Mono',monospace; --sans:'Instrument Sans',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font:16px/1.55 var(--sans)}
a{color:var(--amber);text-decoration:none}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* shell */
#shell{display:flex;min-height:100vh}
nav{
  width:196px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  padding:18px 0;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
}
nav .brand{padding:0 18px 16px}
nav .brand b{font:800 16px var(--mono);color:var(--amber);letter-spacing:1px}
nav .brand small{display:block;color:var(--muted);font:500 11px var(--sans);margin-top:3px}
nav a.st{
  display:flex;align-items:center;gap:10px;min-height:46px;
  font:600 14px var(--sans);color:var(--muted);
  padding:10px 18px;border-left:3px solid transparent;
}
nav a.st:hover{color:var(--text);background:var(--panel2)}
nav a.st.on{color:var(--text);border-left-color:var(--amber);background:var(--panel2)}
nav a.st .ic{font-size:17px;width:22px;text-align:center}
nav .pulse{margin-top:auto;padding:14px 18px;font:500 12px var(--sans);color:var(--muted)}
nav .pulse b{color:var(--safe)}
main{flex:1;padding:26px clamp(16px,4vw,52px);max-width:1100px;width:100%}
h1{font:700 24px var(--sans);margin-bottom:6px}
.sub{color:var(--muted);font-size:15px;margin-bottom:24px;max-width:62ch}
h2{font:700 13px var(--sans);letter-spacing:1px;color:var(--muted);margin:28px 0 12px;text-transform:uppercase}

/* tooltips: hover on desktop; helper lines cover phones */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{
  content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 8px);z-index:30;
  background:#0a0c0f;color:var(--text);border:1px solid var(--line2);border-radius:6px;
  padding:8px 12px;font:500 13px/1.4 var(--sans);width:max-content;max-width:300px;
  box-shadow:0 6px 18px rgba(0,0,0,.5);
}
.help{font:500 13px var(--sans);color:var(--muted);margin-top:4px}

/* panels & tables */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tile .n{font:600 30px var(--mono);color:var(--text)}
.tile .l{font:600 12px var(--sans);color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font:700 12px var(--sans);letter-spacing:.5px;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:2px solid var(--line2);text-transform:uppercase}
td{padding:12px;border-bottom:1px solid var(--line)}
tr.row{cursor:pointer}
tr.row:hover{background:var(--panel2)}
.chip{display:inline-block;font:800 12px var(--mono);letter-spacing:.5px;padding:5px 10px;border-radius:4px;color:#101317}

/* the signature: ANSI placard */
.placard{border:2px solid var(--line2);border-radius:8px;overflow:hidden;margin:20px 0}
.placard .band{font:800 20px var(--mono);letter-spacing:4px;padding:14px 18px;text-align:center}
.placard .body{padding:16px 18px;background:var(--panel);font-size:16px}
.placard.danger .band{background:var(--danger);color:#101317}
.placard.warning .band{background:var(--warning);color:#101317}
.placard.caution .band{background:var(--caution);color:#101317}
.placard.safe .band{background:var(--safe);color:#101317}

/* hazard tape edge — only on pattern alerts: stripes mean "the memory flagged this" */
.alert{background:var(--panel);border:1px solid var(--line);border-radius:0 8px 8px 0;border-left:none;
  padding:12px 16px;margin:10px 0;position:relative}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
  background:repeating-linear-gradient(45deg,var(--caution) 0 7px,#101317 7px 14px)}
.alert .k{font:800 12px var(--mono);letter-spacing:1px;color:var(--caution);text-transform:uppercase}

/* show the math */
details.tape{margin-top:10px}
details.tape summary{font:700 13px var(--sans);color:var(--amber);cursor:pointer;min-height:34px;display:flex;align-items:center}
details.tape pre{font:400 13px/1.8 var(--mono);color:var(--muted);background:#0c0e11;
  border-left:3px solid var(--amber);padding:12px 16px;margin-top:8px;overflow-x:auto;border-radius:0 6px 6px 0}
.hazard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:12px 0}
.hazard .prob{font:600 15px var(--mono)}
.hazard .prob .res{color:var(--safe)}
.hud{font:500 13px var(--sans);color:var(--muted)}
.mono{font-family:var(--mono)}
.huddle{background:var(--panel);border:2px solid var(--caution);border-radius:8px;padding:14px 16px;margin:12px 0;font-size:16px}
.huddle .t{font:800 12px var(--mono);letter-spacing:1.5px;color:var(--caution);text-transform:uppercase;margin-bottom:6px}

/* forms — glove-sized */
label{display:block;font:700 13px var(--sans);color:var(--text);margin:16px 0 6px}
input,select,textarea{
  width:100%;background:#0c0e11;border:2px solid var(--line);border-radius:6px;
  color:var(--text);font:16px var(--sans);padding:12px 14px;min-height:48px;
}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--amber);outline:none}
input::placeholder,textarea::placeholder{color:#6e7886}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}
button.go{
  font:700 15px var(--sans);background:var(--amber);color:#101317;
  border:none;border-radius:6px;padding:0 26px;min-height:50px;cursor:pointer;margin-top:20px;
}
button.go:hover{background:#ecc55e}
button.go:disabled{opacity:.45;cursor:default}
button.ghost{
  font:600 14px var(--sans);background:var(--panel2);color:var(--text);
  border:2px solid var(--line2);border-radius:6px;padding:0 16px;min-height:44px;cursor:pointer;
}
button.ghost:hover{border-color:var(--amber);color:var(--amber)}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.qa{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;margin:8px 0;align-items:start}
.qa button{min-height:48px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:6px}
.checks label{display:flex;align-items:center;gap:10px;font:500 15px var(--sans);margin:0;
  background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px 12px;min-height:48px;cursor:pointer}
.checks input{width:20px;height:20px;min-height:0;accent-color:var(--amber)}
.checks label:has(input:checked){border-color:var(--amber)}
.progress{font:500 15px var(--sans);color:var(--text);padding:20px;border:2px dashed var(--line2);border-radius:8px;margin-top:20px}
.progress b{color:var(--amber);font-family:var(--mono)}
.err{color:var(--danger);font:500 14px var(--sans);margin-top:14px;white-space:pre-wrap}
.okmsg{color:var(--safe);font:600 14px var(--sans);margin-top:12px}
.empty{color:var(--muted);font-size:15px;padding:22px;text-align:center;border:2px dashed var(--line);border-radius:8px}
.prov{font:400 12px var(--mono);color:var(--muted);border-top:1px solid var(--line);margin-top:24px;padding-top:12px}
svg.spark{width:100%;height:80px;display:block}

@media (max-width:780px){
  #shell{flex-direction:column}
  nav{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;gap:0;padding:6px 8px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  nav .brand{padding:0 10px 0 6px}
  nav .brand small{display:none}
  nav a.st{padding:10px 12px;border-left:none;border-bottom:3px solid transparent;white-space:nowrap}
  nav a.st.on{border-bottom-color:var(--amber);border-left:none}
  nav .pulse{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .qa{grid-template-columns:1fr}
}

/* ============================================================
   JHA SHEET — the artifact, rendered as a blueprint document
   on the desk. ALL rules scoped under .jha-sheet so the calm
   workspace (and the 38 other .hud uses) stay untouched.
   Design language = the shipped EAP (eap.rs render_document).
   ============================================================ */
.jha-sheet{
  --js-paper:#f6f2e7; --js-line-soft:#e9e1cd; --js-ink:#201d16; --js-ink-soft:#4a453a;
  --js-line:#16324f; --js-line2:#4d6885; --js-muted:#79705c;
  --js-display:"Bahnschrift","Arial Narrow",Haettenschweiler,"Helvetica Neue",Arial,sans-serif;
  --js-serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,serif;
  --js-mono:Consolas,"SF Mono",Menlo,"Courier New",monospace;
  background:var(--js-paper);
  background-image:repeating-linear-gradient(var(--js-line-soft) 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,var(--js-line-soft) 0 1px,transparent 1px 26px);
  color:var(--js-ink);
  border:2px solid var(--js-line);
  border-radius:2px;
  padding:26px 24px 22px;
  margin:18px 0;
  box-shadow:0 1px 0 2px var(--js-paper),0 2px 14px rgba(20,30,50,.28);
  font-family:var(--js-serif);
}
/* title block — the drawing-sheet corner */
.jha-sheet .jha-tb{border-bottom:2px solid var(--js-line);padding-bottom:12px;margin-bottom:16px}
.jha-sheet .jha-tb-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.jha-sheet .jha-tb-title{font-family:var(--js-display);font-weight:700;font-size:clamp(20px,3.5vw,26px);text-transform:uppercase;letter-spacing:1px;color:var(--js-ink);line-height:1}
.jha-sheet .jha-tb-sub{margin-top:5px;font:600 11px var(--js-mono);letter-spacing:1.5px;text-transform:uppercase;color:var(--js-muted)}
.jha-sheet .jha-tb-cells{display:flex;border:1px solid var(--js-line2)}
.jha-sheet .jha-tb-cell{padding:5px 12px;border-left:1px solid var(--js-line2);display:flex;flex-direction:column;gap:3px;min-width:64px}
.jha-sheet .jha-tb-cell:first-child{border-left:none}
.jha-sheet .jha-tb-l{font:700 9px var(--js-mono);letter-spacing:1px;text-transform:uppercase;color:var(--js-muted)}
.jha-sheet .jha-tb-v{font:700 13px var(--js-display);letter-spacing:.3px;color:var(--js-ink)}
/* section headers — drafting rule + numbered feel */
.jha-sheet h2{font-family:var(--js-display);font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:15px;color:var(--js-ink);border-bottom:1px solid var(--js-line);border-left:none;padding:0 0 6px;margin:24px 0 10px}
/* verdict placard → ink-stamp signal band, functional color kept */
.jha-sheet .placard{border:2px solid var(--js-line);border-radius:2px;background:transparent;margin:16px 0;overflow:hidden}
.jha-sheet .placard .band{font-family:var(--js-mono);font-weight:800;letter-spacing:3px;font-size:17px;padding:11px 16px}
.jha-sheet .placard .body{background:rgba(255,255,255,.35);color:var(--js-ink-soft);font-family:var(--js-serif);font-size:15.5px;line-height:1.6;padding:14px 16px}
/* hazard cards → ruled record blocks */
.jha-sheet .hazard{border:1px solid var(--js-line2);border-left:4px solid var(--js-line);background:rgba(255,255,255,.30);border-radius:2px;padding:14px 16px;margin:12px 0}
.jha-sheet .hazard>div:first-child{font-family:var(--js-display);font-weight:700;font-size:16px;letter-spacing:.2px;color:var(--js-ink)}
.jha-sheet .prob{margin:8px 0}
.jha-sheet .res{font:800 15px var(--js-mono);letter-spacing:.5px;color:var(--js-line);border:1.5px solid var(--js-line);padding:2px 8px;border-radius:2px}
.jha-sheet .hud{font:700 11px var(--js-mono)!important;letter-spacing:.6px;text-transform:uppercase;color:var(--js-muted)}
.jha-sheet .hazard p,.jha-sheet .hazard div,.jha-sheet ul li{font-family:var(--js-serif)}
.jha-sheet ul li{color:var(--js-ink-soft);font-size:15px;line-height:1.55}
/* body prose stays readable serif */
.jha-sheet .hazard>div:nth-child(2){font-family:var(--js-serif)}
/* show-the-math tape → typed audit slip */
.jha-sheet .tape summary{font:700 11px var(--js-mono);letter-spacing:1px;text-transform:uppercase;color:var(--js-line);cursor:pointer;margin-top:10px}
.jha-sheet .tape pre{font:12px/1.5 var(--js-mono);background:rgba(22,50,79,.06);border:1px solid var(--js-line-soft);padding:10px 12px;margin-top:6px;white-space:pre-wrap;color:var(--js-ink-soft);border-radius:2px}
/* alerts, panels, huddle → ruled callouts */
.jha-sheet .alert{border:1px solid var(--js-line2);border-left:4px solid var(--js-muted);background:rgba(255,255,255,.30);padding:10px 14px;margin:10px 0;border-radius:2px}
.jha-sheet .alert .k{font:700 10.5px var(--js-mono);letter-spacing:.8px;text-transform:uppercase;color:var(--js-muted)}
.jha-sheet .panel{border:1px solid var(--js-line2);background:rgba(255,255,255,.30);padding:12px 14px;border-radius:2px}
.jha-sheet .huddle{border:1px dashed var(--js-line2);background:rgba(22,50,79,.05);padding:12px 14px;margin-top:10px;border-radius:2px;font-family:var(--js-serif);font-size:15px;color:var(--js-ink-soft)}
.jha-sheet .huddle .t{font:700 10.5px var(--js-mono);letter-spacing:1px;text-transform:uppercase;color:var(--js-line);margin-bottom:6px}
/* provenance footer → title-block strip */
.jha-sheet .prov{margin-top:22px;border-top:1px solid var(--js-line2);padding-top:10px;font:11px var(--js-mono);letter-spacing:.2px;color:var(--js-muted);word-break:break-all}
.jha-sheet .prov+.hud,.jha-sheet .hud{color:var(--js-muted)}
@media (max-width:600px){
  .jha-sheet{padding:20px 14px 16px}
  .jha-sheet .jha-tb-head{flex-direction:column;align-items:flex-start}
  .jha-sheet .jha-tb-cells{flex-wrap:wrap}
}
</style>
</head>
<body>
<div id="shell">
  <nav>
    <div class="brand"><b>SAFETY COMPANION</b><small>It watches so they go home.</small></div>
    <a class="st" href="#/watch" data-st="watch" data-tip="Everything the system has seen and learned"><span class="ic">⌂</span>Dashboard</a>
    <a class="st" href="#/analyze" data-st="analyze" data-tip="Run a pre-task plan through the safety check"><span class="ic">▶</span>Run JHA</a>
    <a class="st" href="#/eap" data-st="eap" data-tip="Build a complete Emergency Action Plan from a few site facts"><span class="ic">✚</span>Emergency Plan</a>
    <a class="st" href="/viewer" data-tip="View and analyze blueprints and shop drawings"><span class="ic">▦</span>Drawings</a>
    <a class="st" href="#/truth" data-st="truth" data-tip="Report incidents and near misses — this is how it learns"><span class="ic">✎</span>Report Incident</a>
    <a class="st" href="#/profile" data-st="profile" data-tip="Your certs, screens, tasking, and 911 card"><span class="ic">☺</span>My Profile</a>
    <a class="st" href="#/admin" data-st="admin" id="adminlink" style="display:none" data-tip="People, screens, requests, scheduler"><span class="ic">⚙</span>Admin</a>
    <div class="pulse">
      <div style="margin-bottom:8px">
        <button class="ghost" id="signbtn" style="width:100%;min-height:40px">Sign in</button>
      </div>
      system <b>●</b> <span id="pulse">checking…</span></div>
  </nav>
  <main id="main"></main>
</div>

<script>
const $$ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ME = { id: localStorage.scid || "", name: localStorage.scname || "", role: localStorage.scrole || "", token: localStorage.sctoken || "" };
const api = async (path, opts) => {
  opts = opts || {};
  const auth = ME.token ? {"Authorization": "Bearer " + ME.token} : (ME.id ? {"X-Person-Id": ME.id} : {});
  opts.headers = Object.assign({}, opts.headers, auth);
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0,400));
  return r.json();
};

/* verdicts → ANSI signal placards */
const V = {
  STOP_WORK:{cls:"danger",word:"DANGER",label:"STOP WORK",color:"var(--danger)"},
  StopWork:{cls:"danger",word:"DANGER",label:"STOP WORK",color:"var(--danger)"},
  REQUEST_CLARIFICATION:{cls:"warning",word:"WARNING",label:"FIX THE PLAN FIRST",color:"var(--warning)"},
  RequestClarification:{cls:"warning",word:"WARNING",label:"FIX THE PLAN FIRST",color:"var(--warning)"},
  PROCEED_WITH_CONTROLS:{cls:"caution",word:"CAUTION",label:"PROCEED WITH CONTROLS",color:"var(--caution)"},
  ProceedWithControls:{cls:"caution",word:"CAUTION",label:"PROCEED WITH CONTROLS",color:"var(--caution)"},
  PROCEED:{cls:"safe",word:"SAFE",label:"GOOD TO GO",color:"var(--safe)"},
  Proceed:{cls:"safe",word:"SAFE",label:"GOOD TO GO",color:"var(--safe)"},
};
const vinfo = v => V[v] || {cls:"warning",word:"NOTICE",label:String(v),color:"var(--notice)"};
const sevColor = s => ({CRITICAL:"var(--danger)",HIGH:"var(--warning)",MEDIUM:"var(--caution)",LOW:"var(--safe)",INFO:"var(--muted)"}[String(s).toUpperCase()]||"var(--muted)");

/* router */
const routes = { watch: renderWatch, analyze: renderAnalyze, eap: renderEap, truth: renderTruth, report: renderStoredReport, profile: renderProfile, admin: renderAdmin };
function route(){
  const hash = location.hash.replace(/^#\//,"") || "watch";
  const [name, arg] = hash.split("/");
  document.querySelectorAll("nav a.st").forEach(a => a.classList.toggle("on", a.dataset.st === (name==="report"?"watch":name)));
  (routes[name] || renderWatch)(arg);
}
window.addEventListener("hashchange", route);

/* ============ DASHBOARD ============ */
async function renderWatch(){
  const m = $$("#main");
  m.innerHTML = `<h1>Dashboard</h1><div class="sub">Everything this system has analyzed, remembered, and noticed — across every crew and every day.</div><div id="w"></div>`;
  try {
    const [s, list] = await Promise.all([api("/v1/stats"), api("/v1/analyses")]);
    const tiles = `
      <div class="tiles">
        <div class="tile" data-tip="Pre-task plans run through the full safety check"><div class="n">${s.analyses}</div><div class="l">Plans analyzed</div></div>
        <div class="tile" data-tip="Individual hazards found and scored"><div class="n">${s.hazards}</div><div class="l">Hazards scored</div></div>
        <div class="tile" data-tip="Incidents and near misses reported back — how the system learns"><div class="n">${s.incidents}</div><div class="l">Incidents reported</div></div>
        <div class="tile" data-tip="Close calls with no injury — the most valuable reports"><div class="n">${s.near_misses}</div><div class="l">Near misses</div></div>
      </div>`;
    const trend = sparkline(s.trend);
    const patterns = s.patterns.length
      ? s.patterns.map(p => `<div class="alert"><span class="k">Repeating · ${esc(p.kind)}</span>
          <div>Flagged ${p.n} times in the last 30 days · worst score ${p.worst.toFixed(0)}/100. Repeats are how incidents announce themselves.</div></div>`).join("")
      : `<div class="empty">No repeating hazards yet. The system remembers every analysis and will flag anything it sees twice.</div>`;
    const rows = list.length ? list.map(a => {
      const v = vinfo(a.verdict);
      return `<tr class="row" onclick="location.hash='#/report/${a.id}'" data-tip="Open the full report">
        <td class="hud">${new Date(a.created_at).toLocaleString()}</td>
        <td style="text-transform:capitalize">${esc(a.work_type)}</td>
        <td><span class="chip" style="background:${v.color}">${v.label}</span></td>
        <td class="mono">${a.risk.toFixed(0)}/100</td>
        <td class="mono">${a.quality}/10</td></tr>`;
    }).join("") : "";
    $$("#w").innerHTML = tiles
      + `<h2>Average risk · last 14 days</h2><div class="panel">${trend}</div>`
      + `<h2>Repeating hazards the system is tracking</h2>${patterns}`
      + `<h2>Recent analyses — tap any row for the full report</h2>`
      + (rows ? `<div class="panel" style="padding:0;overflow-x:auto"><table><thead><tr>
          <th>When</th><th>Trade</th><th>Call</th><th data-tip="Overall risk, 0–100">Risk</th><th data-tip="How complete the paperwork was, 0–10">Plan quality</th></tr></thead>
          <tbody>${rows}</tbody></table></div>`
        : `<div class="empty">Nothing analyzed yet. <a href="#/analyze">Run the first JHA.</a></div>`);
  } catch(e){ $$("#w").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

function sparkline(trend){
  if (!trend || !trend.length) return `<div class="empty">The trend line appears after a few days of analyses.</div>`;
  const W=600,H=72,P=8;
  const xs = trend.map((_,i)=> P + i*(W-2*P)/Math.max(1,trend.length-1));
  const ys = trend.map(t => H-P - (t.risk/100)*(H-2*P));
  const pts = xs.map((x,i)=>`${x.toFixed(1)},${ys[i].toFixed(1)}`).join(" ");
  const last = trend[trend.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="risk trend">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line2)" stroke-width="1.5"/>
    <polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="2.5"/>
    ${xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="3.5" fill="var(--amber)"/>`).join("")}
    <text x="${W-P}" y="14" text-anchor="end" font-size="12" font-weight="600" fill="var(--muted)">latest ${last.risk.toFixed(0)}/100</text>
  </svg>`;
}

function addQA(qa, label, val){
  const row = document.createElement("div");
  row.className = "qa";
  row.innerHTML = `<input class="q" placeholder="Question" value="${esc(label)}">
    <textarea class="a" placeholder="Specific answer">${esc(val)}</textarea>
    <button class="ghost" title="Remove this question" data-tip="Remove this question">✕</button>`;
  row.querySelector("button").onclick = () => row.remove();
  qa.appendChild(row);
}
async function runAnalysis(){
  const responses = {};
  document.querySelectorAll("#qa .qa").forEach(r => {
    const q = r.querySelector(".q").value.trim(), a = r.querySelector(".a").value.trim();
    if (q) responses[q] = a || "No response";
  });
  const payload = {
    checklist: { id: crypto.randomUUID(), responses,
      work_type: $$("#trade").value, naics_code: $$("#naics").value.trim() || "236220",
      submitted_at: new Date().toISOString() },
    weather: { temperature_f: parseFloat($$("#temp").value) || null,
      wind_speed_mph: parseFloat($$("#wind").value) || null,
      conditions: $$("#cond").value || null },
  };
  const out = $$("#out"), btn = $$("#run");
  btn.disabled = true;
  const t0 = Date.now();
  out.innerHTML = `<div class="progress">Three checks run one after another. This usually takes 1–3 minutes — about the time it takes to pour a coffee.<br>Working… <b id="el">0s</b></div>`;
  const timer = setInterval(()=>{ const el=$$("#el"); if(el) el.textContent = Math.round((Date.now()-t0)/1000)+"s"; }, 1000);
  try {
    const r = await fetch("/v1/analyze", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(payload) });
    clearInterval(timer);
    if (!r.ok) { out.innerHTML = `<div class="err">The analysis didn't finish: ${r.status}\n${esc((await r.text()).slice(0,400))}\nTry again — if it keeps failing the models may be busy.</div>`; return; }
    out.innerHTML = renderReport(await r.json());
    out.scrollIntoView({behavior:"smooth"});
  } catch(e){ clearInterval(timer); out.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  finally { btn.disabled = false; }
}

/* ============ shared report renderer ============ */
function renderReport(r){
  const v = vinfo(r.verdict);
  const placard = `<div class="placard ${v.cls}">
    <div class="band">${v.word} — ${v.label}</div>
    <div class="body">${esc(r.summary)}</div></div>`;

  const hazards = (r.risk?.hazards||[]).map(h => `
    <div class="hazard">
      <div style="margin-bottom:8px;font-weight:600">${esc(h.description)}</div>
      <div class="prob" data-tip="Risk score 0-100 for this hazard. Higher = more dangerous. The raw per-shift probability is in 'Show the math' below.">
        <span class="res">score ${h.risk_score.toFixed(0)}/100</span>
        <span class="hud"> · ${esc(h.severity)}${h.controls?.length?` · ${h.controls.length} control${h.controls.length>1?"s":""} listed`:""}${h.osha_citations?.length?` · OSHA ${esc(h.osha_citations.join(", "))}`:""}</span></div>
      ${h.controls?.length?`<div class="hud" style="margin-top:8px;font-weight:700">CONTROLS THAT COUNT</div><ul style="margin:4px 0 0 20px;font-size:15px">${h.controls.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}
      ${h.inspection_checkpoints?.length?`<div class="hud" style="margin-top:8px;font-weight:700">WALK OUT AND CHECK THESE FIRST</div><ul style="margin:4px 0 0 20px;font-size:15px">${h.inspection_checkpoints.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>`:""}
      ${h.factor_trail?.length?`<details class="tape"><summary data-tip="Every number traced to a named factor — nothing hidden">Show the math</summary><pre>${h.factor_trail.map(esc).join("\n")}${typeof h.probability==="number"?`\n\nper-shift probability (pre-controls):  ${h.probability.toExponential(2)}${typeof h.residual_probability==="number"?`\nper-shift probability (with controls): ${h.residual_probability.toExponential(2)}`:""}\n(per-worker, per-shift — see audit trail, not a field-facing number)`:""}</pre></details>`:""}
    </div>`).join("");

  const likelihoodBand = (x) => {
    if (typeof x !== "number") return "";
    if (x >= 0.66) return "more likely";
    if (x >= 0.33) return "possible";
    return "less likely";
  };
  const scenarios = (r.prediction?.scenarios||[]).map(s => `
    <div class="hazard">
      <div class="hud" style="color:${sevColor(s.severity)};font-weight:700">${esc(String(s.severity).toUpperCase())} · ${esc(s.incident_type)}${likelihoodBand(s.likelihood)?` · ${likelihoodBand(s.likelihood)}`:""}</div>
      <div style="margin:8px 0;font-size:16px">${esc(s.narrative)}</div>
      ${s.prevention?.length?`<div class="hud" style="font-weight:700">WHAT BREAKS THE CHAIN</div><ul style="margin:4px 0 0 20px;font-size:15px">${s.prevention.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:""}
      ${s.toolbox_talk?`<div class="huddle"><div class="t">Toolbox talk — read this to the crew</div>${esc(s.toolbox_talk)}</div>`:""}
    </div>`).join("");

  const alerts = (r.pattern_alerts||[]).map(a => `
    <div class="alert"><span class="k">${esc(a.pattern_kind.replace(/_/g," "))} · ${esc(a.severity)}</span><div>${esc(a.description)}</div></div>`).join("");

  const leading = (r.prediction?.leading_indicators||[]);
  const p = r.provenance || {};
  const ms = Object.entries(p.agent_latency_ms||{}).map(([k,t])=>`${k} ${(t/1000).toFixed(0)}s`).join(" · ");

  const shortId = String(r.id||"").split("-")[0].toUpperCase();
  const titleblock = `<div class="jha-tb">
    <div class="jha-tb-head">
      <div><div class="jha-tb-title">Job Hazard Analysis</div>
      <div class="jha-tb-sub">${esc(r.work_type||"Field JHA")} — Risk Analysis Record</div></div>
      <div class="jha-tb-cells">
        <div class="jha-tb-cell"><span class="jha-tb-l">Record</span><span class="jha-tb-v">${esc(shortId||"—")}</span></div>
        <div class="jha-tb-cell"><span class="jha-tb-l">Quality</span><span class="jha-tb-v">${r.validation?.quality_score??"—"}/10</span></div>
        <div class="jha-tb-cell"><span class="jha-tb-l">Engine</span><span class="jha-tb-v">${esc(p.engine_version||"4.0")}</span></div>
      </div>
    </div>
  </div>`;

  return `<div class="jha-sheet">`
    + titleblock
    + placard
    + (alerts?`<h2>This site's history is talking</h2>${alerts}`:"")
    + (hazards?`<h2>What can hurt someone today</h2>${hazards}`:"")
    + (leading.length?`<h2>Check these in the next 30 minutes</h2><div class="panel"><ul style="margin-left:20px;font-size:15px">${leading.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`:"")
    + (scenarios?`<h2>The incident this prevents — written before it happens</h2>${scenarios}`:"")
    + `<div class="hud" style="margin-top:16px" data-tip="The system is never allowed to be more confident than the paperwork supports">Plan quality ${r.validation?.quality_score}/10 · prediction confidence ${((r.prediction?.confidence||0)*100).toFixed(0)}%</div>`
    + `<div class="prov">record ${esc(r.id)} · engine ${esc(p.engine_version||"")} · schema ${esc(p.schema_version||"4.0")}${ms?` · ${esc(ms)}`:""}</div>`
    + `</div>`;
}

    <select id="lg_who">${dir.length?dir.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join(""):'<option value="">no people yet — create one in Admin</option>'}</select>
    <label>PIN</label>
    <input id="lg_pin" type="password" inputmode="numeric" autocomplete="off" placeholder="4–8 digits">
    <div id="lg_setarea" style="display:none">
      <div class="help" style="margin-top:8px">First time signing in — set a PIN you'll remember.</div>
      <label>New PIN</label><input id="lg_newpin" type="password" inputmode="numeric" placeholder="4–8 digits">
    </div>
    <div class="btnrow"><button class="go" id="lg_go">Sign in</button>
      <button class="ghost" onclick="document.getElementById('loginmodal').remove()">Cancel</button></div>
    <div id="lg_msg"></div>
  </div>`;
  document.body.appendChild(wrap);
  $$("#lg_go").onclick = doLogin;
  $$("#lg_pin").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
}
async function doLogin(){
  const id = $$("#lg_who").value, msg = $$("#lg_msg");
  const setArea = $$("#lg_setarea"), settingPin = setArea.style.display !== "none";
  if (!id) { msg.innerHTML='<div class="err">Pick your name first.</div>'; return; }
  try {
    if (settingPin) {
      const np = $$("#lg_newpin").value;
      const r = await api("/v1/auth/set-pin", {method:"POST",headers:{"content-type":"application/json"},
        body: JSON.stringify({person_id:id, new_pin:np})});
      finishLogin(id, r);
      return;
    }
    const r = await api("/v1/auth/login", {method:"POST",headers:{"content-type":"application/json"},
      body: JSON.stringify({person_id:id, pin:$$("#lg_pin").value})});
    if (r.must_set_pin) {
      setArea.style.display="block";
      msg.innerHTML='<div class="okmsg">Set your PIN to finish.</div>';
      return;
    }
    finishLogin(id, r);
  } catch(e){ msg.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
function finishLogin(id, r){
  if (!r.token) return;
  const name = ($$("#lg_who").selectedOptions[0]||{}).textContent || "";
  localStorage.scid=id; localStorage.scname=name; localStorage.scrole=r.role||""; localStorage.sctoken=r.token;
  location.reload();
}
async function checkinBanner(){
  try {
    const c = await api("/v1/checkin");
    if (!c.due) return;
    const b = document.createElement("div");
    b.className = "panel"; b.style.cssText = "border-color:var(--amber);margin-bottom:18px";
    b.innerHTML = `<div style="font-weight:700;margin-bottom:6px">Quick check-in, ${esc(ME.name.split(" ")[0])} — 30 seconds, straight answer.</div>
      <div style="font-size:16px;margin-bottom:8px">${esc(c.question)}</div>
      <textarea id="ci_a" placeholder="Honest beats polished."></textarea>
      <div class="btnrow"><button class="go" style="margin-top:10px" id="ci_go">Send it</button></div>
      <div id="ci_msg"></div>`;
    $$("#main").prepend(b);
    $$("#ci_go").onclick = async () => {
      try {
        const r = await api("/v1/checkin", {method:"POST",headers:{"content-type":"application/json"},
          body: JSON.stringify({answer: $$("#ci_a").value.trim() || "no answer"})});
        if (r.support) { $$("#ci_msg").innerHTML = `<div class="huddle" style="margin-top:10px"><div class="t">We hear you</div>${esc(r.support)}</div>`; $$("#ci_go").style.display="none"; }
        else b.innerHTML = `<div class="okmsg">Thanks. That's it until ${"MWF".includes("M")?"next time":""} — back to work.</div>`;
      } catch(e){ $$("#ci_msg").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    };
  } catch(e){}
}
initSignin();
route();
</script>
</body>
</html>
